  }).withFailureHandler(err=>alert('共有データの読み込みに失敗しました: '+err.message)).getFinanceData();
}
function yen(n){return Math.round(Number(n)||0).toLocaleString('ja-JP')+'円'}function monthRows(){return db.transactions.filter(t=>t.date.slice(0,7)===month)}function sum(a){return a.reduce((s,x)=>s+(Number(x.amount)||0),0)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function totals(){const rows=monthRows();return {income:sum(rows.filter(x=>x.type==='income')),expense:sum(rows.filter(x=>x.type==='expense'))}}function balances(){return Object.fromEntries(Object.keys(names).map(k=>[k,sum(db.accounts.filter(a=>a.owner===k&&a.type!=='loan'))]))}function icon(k){return k==='family'?'🏠':k==='sayaka'?'🌷':'🌿'}
const menu=[['dashboard','⌂  ダッシュボード'],['transactions','✎  収支入力'],['accounts','▣  口座・資産'],['fixed','▤  固定費の設定'],['forecast','▥  資産推移・将来予測'],['goals','⚑  貯金目標']];function goto(k){page=k;render()}function changeMonth(m){month=m;render()}function render(){document.getElementById('month').value=month;document.getElementById('heading').textContent=page==='dashboard'?'佐々木家のお金管理':menu.find(x=>x[0]===page)?.[1].replace(/^.. /,'')||'';document.getElementById('nav').innerHTML=menu.map(([k,v])=>`<button class="nav ${page===k?'on':''}" onclick="goto('${k}')">${v}</button>`).join('');document.getElementById('content').innerHTML=({dashboard,transactions,accounts,fixed,forecast,goals}[page])()}
function dashboard(){let b=balances(),t=totals(),rows=monthRows(),total=sum(Object.values(b).map(amount=>({amount})));let groups={};rows.filter(x=>x.type==='expense').forEach(x=>groups[x.category]=(groups[x.category]||0)+Number(x.amount));return `<div class="kpis">${['family','sayaka','ryusei'].map((k,i)=>`<div class="card kpi"><div class="muted small">${icon(k)} ${k==='family'?'夫婦共有':'個人資産'}</div><h3>${names[k]}</h3><div class="num">${yen(b[k])}</div><div class="small muted">金融資産残高</div><img class="cat" src="${cats[i===1?0:1]}"></div>`).join('')}<div class="card kpi"><div class="muted small">✧ 世帯合計</div><h3>金融資産</h3><div class="num">${yen(total)}</div><div class="small muted">住宅・借入は別途確認</div></div></div><div class="columns"><div class="card"><div class="row"><h2>今月の収支</h2><button class="btn" onclick="goto('transactions')">＋ 収支を入力</button></div><div class="split space"><div class="metric muted">収入<b class="positive">${yen(t.income)}</b></div><div class="metric muted">支出<b class="negative">${yen(t.expense)}</b></div><div class="metric muted">収支差額<b>${yen(t.income-t.expense)}</b></div></div><div class="space muted small">給与・生活費・携帯代・住宅ローンなど、登録した月の明細から自動集計します。</div><div class="space">${rows.slice(-4).reverse().map(x=>`<div class="accountline"><span>${escapeHTML(x.category)} <span class="muted small">${escapeHTML(names[x.owner])}</span></span><b class="${x.type==='expense'?'negative':'positive'}">${x.type==='expense'?'-':'+'}${yen(x.amount)}</b></div>`).join('')||'<p class="empty">まだ入力はありません。右上から登録できます。</p>'}</div></div><div class="card"><div class="row"><h2>支出の内訳</h2><span class="chip">${month}</span></div>${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="space"><div class="row small"><span>${escapeHTML(k)}</span><b>${yen(v)}</b></div><div style="background:#f8ede5;border-radius:99px;height:9px;margin-top:7px"><div style="width:${t.expense?v/t.expense*100:0}%;height:9px;background:#e2a5a2;border-radius:99px"></div></div></div>`).join('')||'<p class="empty">支出を登録すると内訳が表示されます。</p>'}<div class="notice space">🐱 猫たちと一緒に、少しずつ家計を育てていこう。</div></div></div><div class="columns"><div class="card"><div class="row"><h2>口座・資産サマリー</h2><button class="btn" onclick="goto('accounts')">口座を管理</button></div>${db.accounts.filter(a=>a.type!=='loan').slice(0,5).map(a=>`<div class="accountline"><span>${icon(a.owner)} ${escapeHTML(a.name)} <span class="muted small">${escapeHTML(names[a.owner])}</span></span><b>${yen(a.amount)}</b></div>`).join('')||'<p class="empty">銀行口座やNISAなどを登録しましょう。</p>'}</div><div class="card"><div class="row"><h2>将来の資産シミュレーション</h2><button class="btn" onclick="goto('forecast')">試算する</button></div><img src="${cats[0]}" style="width:100px;height:115px;object-fit:contain;float:right"><p class="muted">毎月の貯金や積立を設定すると、5年・10年・20年・35年後を試算できます。</p><button class="btn primary" onclick="goto('forecast')">未来の資産を見る →</button></div></div>`}
function formOwner(){return '<option value="family">佐々木家（共有）</option><option value="sayaka">さやか</option><option value="ryusei">りゅうせい</option>'}function transactions(){return `<div class="columns"><div class="card"><h2>✎ 収支を登録</h2><p class="muted small">固定費も変動費も登録できます。口座間移動は収支に含めないでください。</p><form id="tx" onsubmit="addTx(event)"><div class="formgrid"><label class="field">日付<input type="date" name="date" value="${month}-01" required></label><label class="field">区分<select name="type"><option value="expense">支出</option><option value="income">収入</option></select></label><label class="field">管理先<select name="owner">${formOwner()}</select></label><label class="field">カテゴリ<select name="category">${['給与','賞与','副収入','住宅ローン','管理費','修繕積立金','固定資産税','電気代','ガス代','水道代','食費','日用品','外食','携帯代','インターネット','保険','交通費','医療費','自由に使うお金','旅行','サブスク','その他'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">金額（円）<input type="number" name="amount" min="1" required placeholder="例：30000"></label><label class="field">メモ<input name="memo" placeholder="任意"></label></div><div class="savebar"><button class="btn primary">この内容で登録</button></div></form></div><div class="card"><h2>今月の明細</h2><div style="overflow:auto"><table class="tbl"><tr><th>日付</th><th>項目・管理先</th><th>金額</th></tr>${monthRows().slice().reverse().map(x=>`<tr><td>${escapeHTML(x.date.slice(5))}</td><td>${escapeHTML(x.category)}<div class="muted small">${escapeHTML(names[x.owner])} <button class="btn" style="padding:1px 5px;font-size:10px" onclick="removeItem('transactions','${x.id}')">削除</button></div></td><td class="${x.type==='expense'?'negative':'positive'}">${x.type==='expense'?'-':'+'}${yen(x.amount)}</td></tr>`).join('')||'<tr><td colspan="3">登録なし</td></tr>'}</table></div></div></div>`}
function accounts(){return `<div class="columns"><div class="card"><h2>▣ 口座・資産を登録</h2><form onsubmit="addAccount(event)" class="space"><div class="formgrid"><label class="field">管理区分<select name="owner">${formOwner()}</select></label><label class="field">種類<select name="type"><option value="bank">銀行預金・現金</option><option value="investment">NISA・投資</option><option value="loan">住宅ローン・借入（負債）</option><option value="other">その他金融資産</option></select></label><label class="field">口座・項目名<input name="name" required placeholder="例：〇〇銀行 普通預金"></label><label class="field">現在の残高（円）<input name="amount" type="number" min="0" required></label></div><div class="savebar"><button class="btn primary">登録する</button></div></form><p class="notice">残高は登録時点の値を入力し、次回は更新してください。収支登録から口座残高は自動増減しない仕様です。</p></div><div class="card"><h2>登録中の口座・負債</h2>${db.accounts.map(a=>`<div class="accountline"><span>${icon(a.owner)} ${escapeHTML(a.name)}<div class="muted small">${names[a.owner]} / ${a.type==='loan'?'負債':a.type==='investment'?'投資':'資産'}</div></span><span><b>${yen(a.amount)}</b><br><button class="btn" style="padding:2px 7px;font-size:11px" onclick="updateBalance('${a.id}')">残高更新</button> <button class="btn" style="padding:2px 7px;font-size:11px" onclick="removeItem('accounts','${a.id}')">削除</button></span></div>`).join('')||'<p class="empty">まだ口座は登録されていません。</p>'}</div></div>`}
function fixed(){return `<div class="columns"><div class="card"><h2>▤ 毎月の固定費を設定</h2><p class="muted small">月額のテンプレートを保存し、各月の収支にまとめて反映できます。</p><form onsubmit="addFixed(event)"><div class="formgrid"><label class="field">管理先<select name="owner">${formOwner()}</select></label><label class="field">費目<select name="category">${['住宅ローン','管理費','修繕積立金','電気代','ガス代','水道代','携帯代','インターネット','保険','サブスク','その他'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">毎月の金額（円）<input name="amount" type="number" min="1" required></label><label class="field">メモ<input name="memo" placeholder="任意"></label></div><div class="savebar"><button class="btn primary">固定費を追加</button></div></form><div class="notice space">固定資産税など年払いの費用は「収支入力」で支払月に登録し、年間の予算は目標管理で確認してください。</div></div><div class="card"><div class="row"><h2>固定費リスト</h2><button class="btn primary" onclick="applyFixed()">${month} に一括反映</button></div>${db.fixed.map(x=>`<div class="accountline"><span>${escapeHTML(x.category)}<div class="small muted">${names[x.owner]} ${escapeHTML(x.memo||'')}</div></span><span><b>${yen(x.amount)}</b> <button class="btn" onclick="removeItem('fixed','${x.id}')">削除</button></span></div>`).join('')||'<p class="empty">固定費を登録してください。</p>'}</div></div>`}
function forecast(){let b=balances(),start=Object.values(b).reduce((a,c)=>a+c,0);return `<div class="columns"><div class="card"><h2>▥ 将来の資産シミュレーション</h2><p class="small muted">金融資産の予測です。年率は仮定であり、運用成果を保証するものではありません。</p><div class="formgrid space"><label class="field">毎月の貯金・積立（円）<input type="number" id="contrib" min="0" value="100000" oninput="updateForecast()"></label><label class="field">想定年利（%）<input type="number" id="rate" min="-20" max="20" step="0.5" value="2" oninput="updateForecast()"></label></div><div class="tabs space">${[5,10,20,35].map(y=>`<button class="tab ${forecastYears===y?'on':''}" onclick="forecastYears=${y};updateForecast()">${y}年後</button>`).join('')}</div><div class="space muted">予測金融資産</div><div id="fvalue" style="font-size:32px;font-weight:850"></div><div id="fgraph"></div></div><div class="card"><h2>試算の考え方</h2><p>開始資産：<b>${yen(start)}</b></p><p class="muted small">登録した資産残高を出発点に、毎月末の積立と想定利回りから試算します。住宅評価額・ローン残債・税金・手数料・インフレは含みません。</p><div class="notice">住宅ローンはペアローンごとに「口座・資産」の負債として登録できます。純資産は金融資産と住宅価値から借入残高を引いて考えます。</div><img src="${cats[1]}" style="display:block;margin:10px auto 0;height:185px;max-width:100%;object-fit:contain"></div></div>`}
function updateForecast(){document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('on',[5,10,20,35][i]===forecastYears));let start=Object.values(balances()).reduce((a,c)=>a+c,0),deposit=Number(document.getElementById('contrib').value)||0,rate=(Number(document.getElementById('rate').value)||0)/1200,v=start,pts=[v];for(let i=0;i<forecastYears*12;i++){v=v*(1+rate)+deposit;if((i+1)%12===0)pts.push(v)}document.getElementById('fvalue').textContent=yen(v);let max=Math.max(1,...pts),xy=pts.map((x,i)=>`${30+i*640/forecastYears},${220-x/max*195}`).join(' ');document.getElementById('fgraph').innerHTML=`<svg class="graph" viewBox="0 0 700 260" preserveAspectRatio="none"><line x1="30" y1="220" x2="680" y2="220" stroke="#d9c9be"/><polyline fill="none" stroke="#d98f98" stroke-width="4" stroke-linejoin="round" points="${xy}"/><text x="30" y="245" fill="#9b8880">現在</text><text x="610" y="245" fill="#9b8880">${forecastYears}年後</text></svg>`}
function goals(){return `<div class="columns"><div class="card"><h2>⚑ 貯金目標を登録</h2><form onsubmit="addGoal(event)"><div class="formgrid space"><label class="field">目標名<input name="name" placeholder="例：旅行・教育資金" required></label><label class="field">管理区分<select name="owner">${formOwner()}</select></label><label class="field">目標金額（円）<input type="number" name="target" min="1" required></label><label class="field">現在の積立額（円）<input type="number" name="saved" min="0" value="0" required></label></div><div class="savebar"><button class="btn primary">目標を追加</button></div></form></div><div class="card"><h2>目標と達成率</h2>${db.goals.map(x=>`<div class="space"><div class="row"><b>${escapeHTML(x.name)}</b><button class="btn" onclick="removeItem('goals','${x.id}')">削除</button></div><div class="small muted">${names[x.owner]} / ${yen(x.saved)} / ${yen(x.target)}</div><div style="height:12px;background:#f4e9df;border-radius:99px;margin-top:8px"><div style="height:12px;width:${Math.min(100,x.saved/x.target*100)}%;background:#8fb28f;border-radius:99px"></div></div><button class="btn space" onclick="updateGoal('${x.id}')">積立額を更新</button></div>`).join('')||'<p class="empty">旅行などの貯金目標を作成しましょう。</p>'}</div></div>`}
function fd(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function addTx(e){let x=fd(e);db.transactions.push({...x,id:crypto.randomUUID(),amount:Number(x.amount)});save()}function addAccount(e){let x=fd(e);db.accounts.push({...x,id:crypto.randomUUID(),amount:Number(x.amount)});save()}function addFixed(e){let x=fd(e);db.fixed.push({...x,id:crypto.randomUUID(),amount:Number(x.amount)});save()}function addGoal(e){let x=fd(e);db.goals.push({...x,id:crypto.randomUUID(),target:Number(x.target),saved:Number(x.saved)});save()}function removeItem(k,id){if(!confirm('この項目を削除しますか？'))return;db[k]=db[k].filter(x=>x.id!==id);save()}function updateBalance(id){let x=db.accounts.find(a=>a.id===id),n=prompt('新しい残高（円）を入力',x.amount);if(n!==null&&n.trim()!==''&&!isNaN(+n)&&+n>=0){x.amount=+n;save()}}function updateGoal(id){let x=db.goals.find(a=>a.id===id),n=prompt('現在の積立額（円）を入力',x.saved);if(n!==null&&n.trim()!==''&&!isNaN(+n)&&+n>=0){x.saved=+n;save()}}function applyFixed(){let existing=db.transactions.filter(t=>t.date.slice(0,7)===month&&t.fixedId).map(t=>t.fixedId),add=db.fixed.filter(f=>!existing.includes(f.id));if(!add.length){alert('未反映の固定費はありません');return}if(!confirm(`${add.length}件の固定費を${month}に登録しますか？`))return;add.forEach(f=>db.transactions.push({id:crypto.randomUUID(),fixedId:f.id,date:month+'-01',type:'expense',owner:f.owner,category:f.category,amount:f.amount,memo:f.memo}));save()};render();
const originalRender=render;render=function(){originalRender();if(page==='forecast')updateForecast()};

window.addEventListener('load',loadSharedData);
